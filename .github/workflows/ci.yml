name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt
            constraints-base.txt
      - name: Install CI dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints-base.txt
      - name: Ruff
        run: python -m ruff check app ui scripts tests
      - name: Compile Python sources
        run: python -m compileall -q app ui scripts
      - name: Run tests
        run: python -m pytest -q -m "not gpu and not dataset" --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -c constraints-base.txt
      - name: Audit installed environment
        run: python -m pip_audit --format json --output pip-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.json

  release-zip:
    name: Windows release ZIP
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
          }
      - name: Build release archive
        shell: pwsh
        run: ./scripts/build_release.ps1 -Version 0.4.0-dev
      - uses: actions/upload-artifact@v4
        with:
          name: handwriting-ocr-windows
          path: dist/*.zip
