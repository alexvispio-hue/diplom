[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handwriting-ocr-local"
version = "0.2.0"
description = "Local Russian handwriting recognition application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.19",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "pillow>=11.0",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "opencv-python>=4.10",
    "numpy>=2.2",
    "streamlit>=1.41",
    "requests>=2.32",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.47",
    "sentencepiece>=0.2",
    "accelerate>=1.2",
    "qwen-vl-utils>=0.0.8",
]

[project.scripts]
handwriting-ocr = "app.launcher:main"

[tool.setuptools.packages.find]
include = ["app*", "ui*"]
